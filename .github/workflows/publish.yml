# Builds the wheels (abi3: one per platform, Python 3.11+) and the sdist, and
# publishes them to PyPI when a release is published (or by hand); the release
# notes are generated by git-cliff (cliff.toml). Trusted
# publishing: the `pypi` environment of this repository must be registered as
# a publisher of cathedra on PyPI. The viewer bundle is committed
# (src/cathedra/data/): no Node needed.
name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  release-notes:
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate the release notes (git-cliff)
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: release-notes.md
      - name: Update the release notes
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md

  wheels:
    name: wheel ${{ matrix.target }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `--features` replaces the features of pyproject.toml: pyo3's
          # extension-module is given again (else pyo3 links libpython)
          - { os: ubuntu-latest, target: x86_64, manylinux: auto, args: "--features pyo3/extension-module,vendored-openssl" }
          - { os: ubuntu-latest, target: aarch64, manylinux: auto, args: "--features pyo3/extension-module,vendored-openssl" }
          # macos-latest: the numbered images are retired one after the
          # other (macos-13, then macos-14); Intel cross-compiled on Apple silicon
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: PyO3/maturin-action@v1
        env:
          # the release profile keeps the symbols (a macOS 27 dyld issue with
          # stripped dylibs); the published wheels are stripped
          CARGO_PROFILE_RELEASE_STRIP: symbols
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || '' }}
          # the vendored OpenSSL's Configure needs IPC::Cmd and Time::Piece,
          # missing in the x86_64 manylinux image (yum); the aarch64 cross
          # image has them
          before-script-linux: |
            if command -v yum >/dev/null; then yum install -y perl-IPC-Cmd perl-Time-Piece; fi
          args: --release --out dist ${{ matrix.args || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  publish:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
