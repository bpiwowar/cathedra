# Builds the wheels (abi3: one per platform, Python 3.11+) and the sdist, and
# publishes them to PyPI when a release is published (or by hand). Trusted
# publishing: the `pypi` environment of this repository must be registered as
# a publisher of typst-slides on PyPI. The viewer bundle is committed
# (src/typst_slides/data/): no Node needed.
name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  wheels:
    name: wheel ${{ matrix.target }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto, args: "--features vendored-openssl" }
          - { os: ubuntu-latest, target: aarch64, manylinux: auto, args: "--features vendored-openssl" }
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: macos-13, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: PyO3/maturin-action@v1
        env:
          # the release profile keeps the symbols (a macOS 27 dyld issue with
          # stripped dylibs); the published wheels are stripped
          CARGO_PROFILE_RELEASE_STRIP: symbols
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || '' }}
          args: --release --out dist ${{ matrix.args || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  publish:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
