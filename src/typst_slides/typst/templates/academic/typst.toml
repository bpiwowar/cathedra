# The `academic` template of typst-slides, as a Typst package (it is imported
# by path for now: /slide-app/typst/templates/academic/academic.typ; see
# docs/templates.md for the intended package scheme).
[package]
name = "slides-academic"
version = "1.0.0"
entrypoint = "academic.typ"
authors = ["Benjamin Piwowarski"]
license = "MIT"
description = "A plain academic look for typst-slides decks: title slide with artwork, section cards, footer page markers."

[tool.typst-slides]
# the engine API versions it works with (lib/slides.typ `api-version`)
api = ">=3, <5"
