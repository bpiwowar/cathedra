[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "typst-slides"
version = "0.1.0"
description = "Lecture slides in Typst (Touying): web decks with a Reveal.js viewer and live reload, printable PDFs, course sites"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Benjamin Piwowarski" }]
keywords = ["typst", "slides", "touying", "reveal.js", "lecture", "teaching"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Presentation",
]
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "fonttools>=4.55",
    "pillow>=10",
    "platformdirs>=4",
    "pyyaml>=6",
    "typer>=0.12",
    "watchfiles>=0.21",
]

[project.optional-dependencies]
# headless Chromium: widget snapshots for the PDFs, viewer tests
browser = ["playwright>=1.45"]
# `typst-slides convert` (MDX -> Typst; also needs pandoc)
convert = ["json5>=0.9"]

[project.scripts]
typst-slides = "typst_slides.cli:main"

[project.urls]
Repository = "https://git.isir.upmc.fr/bpiwowar/slide-app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pre-commit>=3.7"]

[tool.maturin]
# mixed layout: the Python package in src/typst_slides, the extension
# (rust/lib.rs) as typst_slides._native
python-source = "src"
module-name = "typst_slides._native"
features = ["pyo3/extension-module"]
exclude = ["viewer/node_modules/**"]

[tool.uv]
# `uv run` (e.g. the submodule's makefile.mk) rebuilds the extension when the
# Rust sources change; Python sources are used in place (editable)
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "rust/**/*.rs" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: needs Playwright and Chromium (typst-slides[browser])"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "T20"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 25
